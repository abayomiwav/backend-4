services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stellarexpress
      POSTGRES_PASSWORD: stellarexpress
      POSTGRES_DB: stellarexpress
    ports:
      - '5432:5432'
    volumes:
      - stellarexpress-postgres:/var/lib/postgresql/data

volumes:
  stellarexpress-postgres:
